services:
    test:
        build:
            context: .
            dockerfile: docker/Dockerfile
        image: laravel-tracing-test:local
        working_dir: /app
        volumes:
            - ./:/app
            - composer-cache:/root/.composer/cache
        environment:
            # Selects which DB the test suite runs against (sqlite | pgsql | mysql).
            # Default sqlite needs no DB container; pgsql/mysql require `up -d --wait pgsql mysql`.
            DB_DRIVER: ${DB_DRIVER:-sqlite}
            PG_HOST: pgsql
            PG_DATABASE: tracing_test
            PG_USERNAME: tracing
            PG_PASSWORD: secret
            MYSQL_HOST: mysql
            MYSQL_DATABASE: tracing_test
            MYSQL_USERNAME: tracing
            MYSQL_PASSWORD: secret

    pgsql:
        image: postgres:18.3
        environment:
            POSTGRES_DB: tracing_test
            POSTGRES_USER: tracing
            POSTGRES_PASSWORD: secret
        tmpfs:
            - /var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U tracing -d tracing_test"]
            interval: 3s
            timeout: 3s
            retries: 20

    mysql:
        image: mysql:8.4
        environment:
            MYSQL_DATABASE: tracing_test
            MYSQL_USER: tracing
            MYSQL_PASSWORD: secret
            MYSQL_ROOT_PASSWORD: root
        tmpfs:
            - /var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-utracing", "-psecret"]
            interval: 3s
            timeout: 5s
            retries: 30

volumes:
    composer-cache:
        driver: local
